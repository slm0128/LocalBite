<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LocalBite – Customer Journey Mockup</title>
  <meta name="description" content="Klickbares Customer-Journey-Mockup für LocalBite." />
  <style>
    :root {
      --bg: #f7f7f2;
      --surface: #fff;
      --ink: #1c1917;
      --muted: #78716c;
      --line: #e7e5e4;
      --green: #047857;
      --green-dark: #0b3526;
      --green-soft: #d1fae5;
      --lime: #a7f3d0;
      --amber: #fbbf24;
      --amber-soft: #fef3c7;
      --red: #dc2626;
      --stone: #f5f5f4;
      --shadow: 0 18px 50px rgba(28, 25, 23, .08);
      --shadow-sm: 0 5px 18px rgba(28, 25, 23, .05);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg)
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth
    }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg)
    }

    a {
      color: inherit;
      text-decoration: none
    }

    button,
    input,
    select,
    textarea {
      font: inherit
    }

    button {
      cursor: pointer
    }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 3px solid rgba(16, 185, 129, .22);
      outline-offset: 2px
    }

    .container {
      width: min(1240px, calc(100% - 40px));
      margin: 0 auto
    }

    .wide {
      width: min(1440px, calc(100% - 40px));
      margin: 0 auto
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px
    }

    .logo-mark {
      width: 38px;
      height: 38px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: #059669;
      color: white;
      box-shadow: 0 8px 18px rgba(4, 120, 87, .22)
    }

    .logo-name {
      font-size: 17px;
      font-weight: 900;
      letter-spacing: -.04em;
      line-height: 1
    }

    .logo-sub {
      font-size: 9px;
      letter-spacing: .18em;
      font-weight: 800;
      text-transform: uppercase;
      margin-top: 5px;
      color: #047857
    }

    .logo.light .logo-name {
      color: #fff
    }

    .logo.light .logo-sub {
      color: #a7f3d0
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(247, 247, 242, .95);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(231, 229, 228, .9)
    }

    .topbar-inner {
      height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px
    }

    .role-pill,
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 800;
      box-shadow: var(--shadow-sm)
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981
    }

    .dot.amber {
      background: #f59e0b
    }

    .ghost-btn,
    .small-btn {
      border: 1px solid var(--line);
      background: white;
      border-radius: 999px;
      padding: 9px 13px;
      font-size: 12px;
      font-weight: 800;
      color: #57534e
    }

    .ghost-btn:hover,
    .small-btn:hover {
      border-color: #d6d3d1;
      color: #1c1917
    }

    .stepbar {
      background: white;
      border-bottom: 1px solid var(--line);
      overflow-x: auto
    }

    .steps {
      min-width: max-content;
      display: flex;
      align-items: center;
      padding: 15px 0
    }

    .step-link {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 850;
      color: #a8a29e
    }

    .step-link.active {
      background: #1c1917;
      color: #fff
    }

    .step-link.done {
      color: #047857
    }

    .step-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #f5f5f4;
      font-size: 11px;
      font-weight: 900
    }

    .active .step-num {
      background: rgba(255, 255, 255, .15)
    }

    .done .step-num {
      background: #d1fae5
    }

    .step-line {
      width: 28px;
      height: 1px;
      background: #e7e5e4;
      margin: 0 4px
    }

    .page {
      padding: 48px 0 58px;
      min-height: calc(100vh - 140px)
    }

    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 32px
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: #047857
    }

    .page h1 {
      font-size: 44px;
      line-height: 1.05;
      letter-spacing: -.05em;
      margin: 8px 0 0;
      font-weight: 950
    }

    .lead {
      max-width: 700px;
      color: #78716c;
      font-size: 15px;
      line-height: 1.7;
      margin: 12px 0 0
    }

    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow-sm)
    }

    .card.pad {
      padding: 26px
    }

    .dark-card {
      background: #1c1917;
      color: #fff;
      border-radius: 28px;
      padding: 26px;
      box-shadow: var(--shadow)
    }

    .green-card {
      background: var(--green-dark);
      color: #fff;
      border-radius: 28px;
      padding: 26px
    }

    .grid {
      display: grid;
      gap: 20px
    }

    .grid-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr))
    }

    .grid-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr))
    }

    .two-col {
      grid-template-columns: minmax(0, 1fr) 350px
    }

    .farmer-col {
      grid-template-columns: minmax(0, 1fr) 310px
    }

    .map-col {
      grid-template-columns: 340px minmax(0, 1fr)
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px
    }

    .section-title h2 {
      font-size: 18px;
      margin: 2px 0 0;
      font-weight: 900;
      letter-spacing: -.02em
    }

    .caps {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: #a8a29e
    }

    .status {
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .04em
    }

    .status.green {
      background: #d1fae5;
      color: #047857
    }

    .status.amber {
      background: #fef3c7;
      color: #a16207
    }

    .status.gray {
      background: #f5f5f4;
      color: #78716c
    }

    .status.red {
      background: #fee2e2;
      color: #b91c1c
    }

    .primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 13px;
      background: #047857;
      color: #fff;
      padding: 13px 18px;
      font-size: 13px;
      font-weight: 900;
      transition: .18s
    }

    .primary:hover {
      background: #065f46;
      transform: translateY(-1px)
    }

    .primary.dark {
      background: #1c1917
    }

    .primary.lime {
      background: #a7f3d0;
      color: #064e3b
    }

    .primary.amber {
      background: #fbbf24;
      color: #451a03
    }

    .secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: #fff;
      color: #57534e;
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 850
    }

    .wide-btn {
      width: 100%
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px
    }

    .field label {
      font-size: 11px;
      font-weight: 800;
      color: #57534e
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border: 1px solid #e7e5e4;
      background: #fafaf9;
      border-radius: 12px;
      padding: 12px 13px;
      font-size: 13px;
      color: #292524
    }

    .field textarea {
      resize: vertical;
      min-height: 94px
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px
    }

    .span-2 {
      grid-column: 1/-1
    }

    .hero {
      position: relative;
      min-height: 760px;
      overflow: hidden;
      background: #0b3526;
      color: white
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 15% 20%, rgba(52, 211, 153, .32), transparent 26%), radial-gradient(circle at 85% 85%, rgba(245, 158, 11, .20), transparent 28%)
    }

    .hero-head {
      position: relative;
      z-index: 2;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between
    }

    .hero-content {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1.08fr .92fr;
      gap: 70px;
      align-items: center;
      min-height: 680px;
      padding: 40px 0 80px
    }

    .hero h1 {
      font-size: 76px;
      line-height: .98;
      letter-spacing: -.06em;
      margin: 0;
      font-weight: 950
    }

    .hero h1 span {
      color: #6ee7b7
    }

    .hero p {
      max-width: 690px;
      font-size: 18px;
      line-height: 1.65;
      color: rgba(236, 253, 245, .72)
    }

    .hero-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 30px
    }

    .hero-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 26px;
      color: rgba(236, 253, 245, .65);
      font-size: 12px;
      font-weight: 750
    }

    .hero-demo {
      position: relative
    }

    .demo-window {
      background: #f9faf5;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 34px;
      padding: 15px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .3);
      transform: rotate(-1deg)
    }

    .demo-inner {
      background: #fff;
      color: #1c1917;
      border-radius: 24px;
      padding: 22px
    }

    .mini-products {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 18px
    }

    .mini-product {
      background: #fafaf9;
      border-radius: 16px;
      padding: 13px
    }

    .emoji {
      font-size: 30px
    }

    .tiny {
      font-size: 10px;
      color: #a8a29e
    }

    .demo-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0b3526;
      color: #fff;
      border-radius: 17px;
      padding: 15px;
      margin-top: 12px
    }

    .floating {
      position: absolute;
      left: -25px;
      bottom: -30px;
      background: #fff;
      color: #1c1917;
      border-radius: 18px;
      padding: 14px 16px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 10px;
      width: 225px
    }

    .landing-section {
      padding: 82px 0
    }

    .landing-intro {
      display: grid;
      grid-template-columns: .7fr 1.3fr;
      gap: 60px
    }

    .feature {
      padding: 25px
    }

    .feature-icon {
      font-size: 30px
    }

    .feature h3 {
      font-size: 16px;
      margin: 16px 0 8px;
      font-weight: 900
    }

    .feature p {
      font-size: 13px;
      line-height: 1.7;
      color: #78716c;
      margin: 0
    }

    .cta {
      background: #1c1917;
      color: #fff;
      border-radius: 32px;
      padding: 34px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px
    }

    .cta h2 {
      font-size: 30px;
      margin: 6px 0 0;
      letter-spacing: -.04em
    }

    .cta-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap
    }

    .login-layout {
      display: grid;
      grid-template-columns: .92fr 1.08fr;
      min-height: 100vh
    }

    .register-layout {
      display: grid;
      grid-template-columns: .82fr 1.18fr;
      align-items: start
    }

    .login-art {
      position: relative;
      background: #0b3526;
      color: white;
      padding: 44px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden
    }

    .login-copy {
      max-width: 540px
    }

    .login-copy h1 {
      font-size: 50px;
      line-height: 1.03;
      letter-spacing: -.055em;
      margin: 15px 0
    }

    .login-copy p {
      line-height: 1.7;
      color: rgba(236, 253, 245, .65)
    }

    .persona-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 26px
    }

    .persona {
      border: 1px solid rgba(255, 255, 255, .12);
      background: rgba(255, 255, 255, .08);
      border-radius: 18px;
      padding: 16px
    }

    .login-main {
      display: grid;
      place-items: center;
      padding: 40px
    }

    .login-box {
      width: min(470px, 100%)
    }

    .login-box h2 {
      font-size: 34px;
      letter-spacing: -.045em;
      margin: 8px 0
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #e7e5e4;
      border-radius: 16px;
      padding: 5px;
      margin: 24px 0 16px
    }

    .tab {
      border: 0;
      border-radius: 12px;
      padding: 12px;
      background: transparent;
      color: #78716c;
      font-weight: 900
    }

    .tab.active {
      background: #fff;
      color: #1c1917;
      box-shadow: var(--shadow-sm)
    }

    .overview-card {
      padding: 24px;
      transition: .18s
    }

    .overview-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow);
      border-color: #bbf7d0
    }

    .overview-card .num {
      font-size: 11px;
      letter-spacing: .14em;
      font-weight: 900;
      color: #d6d3d1
    }

    .overview-card .icon {
      font-size: 32px;
      margin-top: 35px
    }

    .overview-card h2 {
      font-size: 18px;
      margin: 14px 0 7px
    }

    .overview-card p {
      font-size: 13px;
      line-height: 1.6;
      color: #78716c
    }

    .overview-next {
      margin-top: 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      background: #0b3526;
      color: white;
      border-radius: 28px;
      padding: 28px
    }

    .overview-next.amber-bg {
      background: #1c1917
    }

    .plan-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px
    }

    .plan {
      position: relative;
      border: 1px solid var(--line);
      background: white;
      border-radius: 18px;
      padding: 18px;
      text-align: left
    }

    .plan.selected {
      border-color: #059669;
      background: #ecfdf5;
      box-shadow: 0 0 0 2px rgba(5, 150, 105, .08)
    }

    .radio {
      width: 20px;
      height: 20px;
      border: 1px solid #d6d3d1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 10px
    }

    .selected .radio {
      background: #047857;
      color: white;
      border-color: #047857
    }

    .plan-top {
      display: flex;
      align-items: center;
      justify-content: space-between
    }

    .plan h3 {
      margin: 15px 0 4px;
      font-size: 14px
    }

    .plan .price {
      font-size: 20px;
      font-weight: 950;
      margin-top: 15px
    }

    .popular {
      position: absolute;
      top: -10px;
      right: 12px;
      background: #047857;
      color: white;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 9px;
      font-weight: 900
    }

    .summary-lines {
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 12px
    }

    .summary-line {
      display: flex;
      justify-content: space-between;
      gap: 15px
    }

    .summary-line span:first-child {
      color: #a8a29e
    }

    .divider {
      height: 1px;
      background: rgba(255, 255, 255, .1);
      margin: 18px 0
    }

    .divider.light {
      background: #e7e5e4
    }

    .notice {
      border-radius: 14px;
      padding: 13px 14px;
      font-size: 11px;
      line-height: 1.6
    }

    .notice.green {
      background: rgba(16, 185, 129, .12);
      color: #d1fae5
    }

    .notice.amber {
      background: #fffbeb;
      color: #78350f
    }

    .box-banner {
      background: #0b3526;
      color: white;
      border-radius: 28px 28px 0 0;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: #e7e5e4
    }

    .product {
      background: white;
      padding: 20px
    }

    .product .emoji-box,
    .animal-icon,
    .farm-icon {
      width: 50px;
      height: 50px;
      border-radius: 16px;
      background: #f5f5f4;
      display: grid;
      place-items: center;
      font-size: 28px
    }

    .product h3 {
      font-size: 13px;
      margin: 14px 0 3px
    }

    .tag-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 10px
    }

    .tag {
      font-size: 9px;
      font-weight: 800;
      background: #f5f5f4;
      border-radius: 999px;
      padding: 5px 8px
    }

    .tag.green {
      background: #d1fae5;
      color: #047857
    }

    .tag.amber {
      background: #fffbeb;
      color: #b45309
    }

    .extra-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px
    }

    .extra {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 18px;
      padding: 15px;
      text-align: left
    }

    .extra.selected {
      border-color: #059669;
      background: #ecfdf5
    }

    .cart-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px
    }

    .emoji-row {
      display: flex;
      gap: 7px;
      flex-wrap: wrap
    }

    .emoji-chip {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #f5f5f4;
      display: grid;
      place-items: center;
      font-size: 21px
    }

    .success {
      text-align: center;
      max-width: 780px;
      margin: 0 auto;
      padding: 40px
    }

    .success-mark {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #d1fae5;
      color: #047857;
      font-size: 26px;
      font-weight: 900;
      margin: 0 auto
    }

    .success h2 {
      font-size: 32px;
      letter-spacing: -.045em;
      margin: 14px 0
    }

    .success p {
      color: #78716c;
      line-height: 1.7
    }

    .success-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 26px auto;
      max-width: 590px
    }

    .success-stat {
      background: #fafaf9;
      border-radius: 17px;
      padding: 15px
    }

    .animal-row {
      border: 1px solid var(--line);
      background: white;
      border-radius: 24px;
      padding: 18px;
      text-align: left;
      width: 100%;
      box-shadow: var(--shadow-sm)
    }

    .animal-row.selected {
      border-color: #059669;
      box-shadow: 0 0 0 2px rgba(5, 150, 105, .08)
    }

    .animal-wrap {
      display: flex;
      gap: 16px
    }

    .animal-row h3 {
      margin: 0;
      font-size: 16px
    }

    .animal-row p {
      font-size: 12px;
      line-height: 1.6;
      color: #78716c
    }

    .animal-aside {
      position: sticky;
      top: 125px;
      height: fit-content
    }

    .map-side {
      padding: 18px
    }

    .farm-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px
    }

    .farm {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 17px;
      padding: 13px;

    };
    window.app = app;
    function render() { let r = route(); let html; switch (r.path) { case '/': html = landing(); break; case '/login': html = login(); break; case '/register': html = register(r.params); break; case '/customer': html = customerOverview(); break; case '/customer/abo': html = customerAbo(); break; case '/customer/box': html = customerBox(); break; case '/customer/cart': html = customerCart(); break; case '/customer/partnership': html = customerPartnership(); break; case '/customer/map': html = customerMap(); break; case '/farmer': html = farmerOverview(); break; case '/farmer/profile': html = farmerProfile(); break; case '/farmer/partnerships': html = farmerPartnerships(); break; case '/farmer/requests': html = farmerRequests(); break; default: html = landing() }document.getElementById('app').innerHTML = html; window.scrollTo(0, 0) }
    window.addEventListener('hashchange', render); render();
  </script>
</body>
